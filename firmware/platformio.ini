; Lumos Joy firmware — build with:  pio run -e joy-left -t upload   (see README)
[platformio]
default_envs = joy-left, joy-right

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB
monitor_speed = 1000000
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -O2
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DLUMOS_FW_MAJOR=1 -DLUMOS_FW_MINOR=0 -DLUMOS_FW_PATCH=0
  -Iinclude

[env:joy-left]
build_flags = ${env.build_flags} -DLUMOS_SIDE_LEFT

[env:joy-right]
build_flags = ${env.build_flags} -DLUMOS_SIDE_RIGHT

; raw UART over the pogo pins instead of USB-CDC (handheld side uses a USB-UART bridge)
[env:joy-left-uart]
build_flags = ${env.build_flags} -DLUMOS_SIDE_LEFT -DLUMOS_POGO_UART

[env:joy-right-uart]
build_flags = ${env.build_flags} -DLUMOS_SIDE_RIGHT -DLUMOS_POGO_UART

; chassis MCU in the handheld: hall-sensor dock detection + body LRA
[env:chassis]
build_flags = ${env.build_flags} -DLUMOS_CHASSIS

; host-side unit tests for the portable parts (protocol, fusion, haptic sequencer)
[env:native]
platform = native
framework =
lib_deps =
build_flags = -std=gnu++17 -Iinclude
test_build_src = no
